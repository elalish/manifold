name: publish_npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to publish from (e.g. v3.5.2)'
        required: true

jobs:
  publish_npm:
    # Matches the WASM build environment in manifold.yml.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      id-token: write  # Required for OIDC
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.ref) || github.ref }}

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org/'
        # No shared cache on the publish path.
        package-manager-cache: false

    - name: Update npm # Ensure npm 11.5.1 or later for trusted publishing
      run: npm install -g npm@latest

    - name: Install cmake
      run: sudo apt-get update && sudo apt-get install -y cmake

    - name: Setup EMSDK
      uses: mymindstorm/setup-emsdk@v16
      with:
        version: 5.0.2

    - uses: ./.github/actions/git-clone
      with:
        name: tbb
        url: https://github.com/oneapi-src/oneTBB.git
        tag: v2022.3.0

    - uses: ./.github/actions/git-clone
      with:
        name: gtest
        url: https://github.com/google/googletest.git
        tag: v1.17.0

    # Built here rather than downloaded from a CI artifact, so what ships is
    # always the checked-out commit.
    - name: Build WASM
      run: |
        emcmake cmake \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DMANIFOLD_STRICT=ON \
          -DMANIFOLD_PAR=OFF \
          -DMANIFOLD_USE_BUILTIN_TBB=ON \
          -DMANIFOLD_DEBUG=OFF \
          -DMANIFOLD_ASSERT=OFF \
          -DFETCHCONTENT_SOURCE_DIR_TBB=tbb \
          -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=gtest \
          . -B build
        cd build
        emmake make

    # manifold-3d goes first, because manifold-cad depends on that exact
    # version. A version that is already on npm is skipped, so if
    # manifold-cad fails, re-running the job does not fail on manifold-3d.
    - name: Publish to npm
      run: |
        publish_if_new() {
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # npm view prints nothing (and may still succeed) for a version
          # that does not exist, so compare its output instead.
          if [ "$(npm view "$name@$version" version 2> /dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; skipping."
          else
            npm publish
          fi
        }
        cd ./bindings/wasm/
        npm ci
        publish_if_new
        cd manifold-cad
        publish_if_new
