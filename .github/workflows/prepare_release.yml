name: Prepare release

# Bumps the version everywhere it appears and opens a PR with the result.
# Run this before tagging, so the commit you tag already carries the right
# version. Deriving it here rather than at publish time means what ships
# always corresponds to a real commit in history.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without a leading v (e.g. 3.6.0)'
        required: true

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - uses: actions/setup-node@v6
      with:
        node-version: 25

    - name: Set the version
      run: python3 scripts/set_version.py "${{ inputs.version }}"

    # package-lock files embed the version, so they drift if left alone.
    - name: Update package-lock files
      run: |
        cd bindings/wasm
        npm run install:all

    # gh rather than a third-party action; release_file.yml already uses it.
    - name: Commit and open a pull request
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ inputs.version }}
      run: |
        set -e
        if git diff --quiet; then
          echo "Already at $VERSION; nothing to do."
          exit 0
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git checkout -b "release/v$VERSION"
        git commit -am "Set version to $VERSION"
        git push origin "release/v$VERSION"
        # Heredoc so the body is not indented by the YAML block scalar,
        # which markdown would render as a code block.
        cat > /tmp/pr-body.md <<EOF
        Generated by the Prepare release workflow.

        Sets the version to \`$VERSION\` across CMakeLists.txt, pyproject.toml,
        flake.nix, bindings/wasm/package.json and scripts/test-cmake.sh, and
        refreshes the package-lock files.

        Once merged, tag the merge commit \`v$VERSION\` and publish the release.
        The tagged commit then carries the matching version, which is what
        publish_npm reads.
        EOF
        sed -i 's/^        //' /tmp/pr-body.md
        gh pr create --title "Release v$VERSION" --body-file /tmp/pr-body.md
