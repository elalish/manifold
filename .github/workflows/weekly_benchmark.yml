name: Weekly Benchmarks

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write

concurrency:
  group: weekly-benchmark
  cancel-in-progress: false

jobs:
  build_sanitizer:
    name: Sanitizer build (ASan+UBSan)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Install apt packages
      uses: awalsh128/cache-apt-pkgs-action@v1.6.0
      with:
        packages: libgtest-dev libtbb-dev cmake
        version: 1
    - name: Build (asan/ubsan)
      run: bash ./scripts/ci/sanitizer_build.sh
    - name: Upload sanitizer build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sanitizer-build
        path: build/
        retention-days: 1
    - name: Upload sanitizer cmake configure log
      uses: actions/upload-artifact@v4
      with:
        name: sanitizer-cmake-log
        path: build/cmake_configure.log
        retention-days: 1

  test_sanitizer:
    name: Sanitizer extended subset (ASan+UBSan)
    needs: build_sanitizer
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_container_overflow=0
      UBSAN_OPTIONS: print_stacktrace=1
      SANITIZER_TEST_TIMEOUT_SEC: 1200
      SANITIZER_SUBSET: extended
    steps:
    - uses: actions/checkout@v6
    - name: Download sanitizer build artifacts
      uses: actions/download-artifact@v4
      with:
        name: sanitizer-build
        path: build
    - name: Test extended sanitizer subset
      shell: bash
      run: bash ./scripts/ci/sanitizer_test.sh

  weekly_benchmark:
    name: Weekly benchmarks
    needs: [build_sanitizer, test_sanitizer]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 60
    runs-on: macos-15
    env:
      WEEKLY_BENCHMARK_REPEATS: 5
      WEEKLY_BENCHMARK_THREADS: 1
      CMAKE_OSX_ARCHITECTURES: arm64
      DATA_BRANCH: benchmark-data
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      SANITIZER_SUMMARY_SUBSET: extended
      SANITIZER_SUMMARY_RUNNER: ubuntu-24.04
      SANITIZER_SUMMARY_OS: Linux
      SANITIZER_BUILD_RESULT: ${{ needs.build_sanitizer.result }}
      SANITIZER_TEST_RESULT: ${{ needs.test_sanitizer.result }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Download sanitizer cmake configure log
      if: always()
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: sanitizer-cmake-log
        path: sanitizer-cmake-log
    - name: Resolve sanitizer compiler
      run: |
        python3 - <<'PY' >> "$GITHUB_ENV"
        import sys
        sys.path.insert(0, "scripts")
        from pathlib import Path
        from system_metadata import cmake_compiler, parse_cmake_configure_log

        cmake = parse_cmake_configure_log(Path("sanitizer-cmake-log/cmake_configure.log"))
        print(f"SANITIZER_SUMMARY_COMPILER={cmake_compiler(cmake) or 'unknown'}")
        PY
    - name: Install brew packages
      run: brew install googletest assimp tbb cmake
    - name: Run weekly benchmarks
      shell: bash
      run: python3 ./scripts/run_weekly_benchmarks.py . ./bench/weekly "${WEEKLY_BENCHMARK_REPEATS}"
    - name: Report weekly benchmarks
      run: python3 ./scripts/report_weekly_benchmarks.py . ./bench/weekly "${WEEKLY_BENCHMARK_REPEATS}"
    - name: Upload weekly benchmark artifacts
      uses: actions/upload-artifact@v4
      with:
        name: weekly-benchmark
        path: ./bench/weekly/
        retention-days: 30
    - name: Publish weekly benchmark data
      if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      run: |
        set -u
        # github-actions[bot]'s identity for committing with the built-in
        # token, see https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git ls-remote --exit-code --heads origin "${DATA_BRANCH}" >/dev/null 2>&1; then
          git fetch origin "${DATA_BRANCH}"
          git worktree add benchmark-data "origin/${DATA_BRANCH}"
        else
          git worktree add --detach benchmark-data
          git -C benchmark-data checkout --orphan "${DATA_BRANCH}"
          git -C benchmark-data rm -rf . >/dev/null 2>&1 || true
          find benchmark-data -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
        fi

        python3 ./scripts/publish_weekly_benchmark_results.py \
          ./bench/weekly ./benchmark-data \
          --release-tag "${RELEASE_TAG}" \
          --sanitizer-subset "${SANITIZER_SUMMARY_SUBSET}" \
          --sanitizer-build-result "${SANITIZER_BUILD_RESULT}" \
          --sanitizer-test-result "${SANITIZER_TEST_RESULT}" \
          --sanitizer-runner "${SANITIZER_SUMMARY_RUNNER}" \
          --sanitizer-os "${SANITIZER_SUMMARY_OS}" \
          --sanitizer-compiler "${SANITIZER_SUMMARY_COMPILER}"

        git -C benchmark-data add weekly
        if git -C benchmark-data diff --cached --quiet; then
          echo "No benchmark data changes to publish."
          exit 0
        fi
        git -C benchmark-data commit -m "add weekly benchmark result ${GITHUB_RUN_ID}"
        git -C benchmark-data push origin "HEAD:${DATA_BRANCH}"
