name: Weekly Benchmarks

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

concurrency:
  group: weekly-benchmark
  cancel-in-progress: false

jobs:
  sanitizer:
    uses: ./.github/workflows/sanitizer.yml
    with:
      subset: extended
      retention-days: 1

  wasm_size:
    name: WASM size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      bytes: ${{ steps.measure.outputs.bytes }}
    env:
      EMSDK_VERSION: 5.0.2
    steps:
    - uses: actions/checkout@v6
    - run: |
        sudo apt-get update
        sudo apt-get install -y cmake
    - name: Setup EMSDK
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: ${{ env.EMSDK_VERSION }}
    - uses: ./.github/actions/git-clone
      with:
        name: tbb
        url: https://github.com/oneapi-src/oneTBB.git
        tag: v2022.3.0
    - uses: ./.github/actions/git-clone
      with:
        name: gtest
        url: https://github.com/google/googletest.git
        tag: v1.17.0

    # These flags mirror publish_npm.yml exactly
    - name: Build WASM
      run: |
        emcmake cmake \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DMANIFOLD_STRICT=ON \
          -DMANIFOLD_PAR=OFF \
          -DMANIFOLD_USE_BUILTIN_TBB=ON \
          -DMANIFOLD_DEBUG=OFF \
          -DMANIFOLD_ASSERT=OFF \
          -DFETCHCONTENT_SOURCE_DIR_TBB=tbb \
          -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=gtest \
          . -B build
        cd build
        emmake make

    # bindings/wasm/CMakeLists.txt copies the build output back here for npm,
    # so this path is the file that ships.
    - name: Measure
      id: measure
      run: |
        bytes=$(stat -c%s bindings/wasm/manifold.wasm)
        echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
        echo "manifold.wasm: $bytes bytes" | tee -a "$GITHUB_STEP_SUMMARY"

  weekly_benchmark:
    name: Weekly benchmarks
    needs: [sanitizer, wasm_size]
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    runs-on: macos-15
    # Pushes results to the benchmark-data branch.
    permissions:
      contents: write
    env:
      WEEKLY_BENCHMARK_REPEATS: 5
      WEEKLY_BENCHMARK_THREADS: 1
      CMAKE_OSX_ARCHITECTURES: arm64
      DATA_BRANCH: benchmark-data
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      SANITIZER_SUMMARY_SUBSET: extended
      SANITIZER_SUMMARY_RUNNER: ubuntu-24.04
      SANITIZER_SUMMARY_OS: Linux
      SANITIZER_BUILD_RESULT: ${{ needs.sanitizer.outputs.build-result }}
      SANITIZER_TEST_RESULT: ${{ needs.sanitizer.outputs.test-result }}
      WASM_SIZE_BYTES: ${{ needs.wasm_size.outputs.bytes }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install brew packages
      run: brew install googletest assimp tbb cmake
    - name: Run weekly benchmarks
      shell: bash
      run: python3 ./scripts/run_weekly_benchmarks.py . ./bench/weekly "${WEEKLY_BENCHMARK_REPEATS}"
    - name: Report weekly benchmarks
      run: python3 ./scripts/report_weekly_benchmarks.py . ./bench/weekly "${WEEKLY_BENCHMARK_REPEATS}"
    - name: Publish weekly benchmark data
      if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      run: |
        # github-actions[bot]'s identity for committing with the built-in
        # token, see https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch origin "${DATA_BRANCH}"
        git worktree add benchmark-data "origin/${DATA_BRANCH}"

        python3 ./scripts/publish_weekly_benchmark_results.py \
          ./bench/weekly ./benchmark-data \
          --release-tag "${RELEASE_TAG}" \
          --sanitizer-subset "${SANITIZER_SUMMARY_SUBSET}" \
          --sanitizer-build-result "${SANITIZER_BUILD_RESULT}" \
          --sanitizer-test-result "${SANITIZER_TEST_RESULT}" \
          --sanitizer-runner "${SANITIZER_SUMMARY_RUNNER}" \
          --sanitizer-os "${SANITIZER_SUMMARY_OS}" \
          --wasm-size-bytes "${WASM_SIZE_BYTES}"

        # Rebuilt in full each time, so this doubles as the backfill.
        python3 ./scripts/collect_wasm_release_sizes.py \
          ./benchmark-data/weekly/wasm-release-sizes.json

        git -C benchmark-data add weekly
        git -C benchmark-data commit -m "add weekly benchmark result ${GITHUB_RUN_ID}"
        git -C benchmark-data push origin "HEAD:${DATA_BRANCH}"
